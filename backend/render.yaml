# Render Blueprint - FREE plan only.
#   API      -> Render free web service (this file)
#   Database -> Neon free PostgreSQL (paste its connection string as DATABASE_URL)
#   Uptime   -> UptimeRobot free monitor pinging "/" every 5 min keeps the API awake
#
# Render dashboard -> New -> Blueprint -> select this repo.
services:
  - type: web
    name: canteen-backend
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: python seed.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: "1440"
      - key: SEED_STAFF_PASSWORD
        sync: false
