# Render Blueprint: free web service + free PostgreSQL.
# Render dashboard -> New -> Blueprint -> select this repo.
services:
  - type: web
    name: canteen-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python seed.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: canteen-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_STAFF_PASSWORD
        sync: false

databases:
  - name: canteen-db
    plan: free
    databaseName: canteen
    user: canteen
